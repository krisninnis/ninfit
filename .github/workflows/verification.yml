name: Verification Gate

on:
  pull_request:
    branches: [main]
  push:
    # `main` is the merged trunk. `review/**` and `ci/**` are the branches that
    # produce an acceptance APK before anything is merged, and a push event runs
    # the workflow against that branch's exact head SHA rather than a synthetic
    # merge commit - which is the run we cite when handing an APK to a phone.
    branches: [main, 'review/**', 'ci/**']

permissions:
  contents: read

env:
  # A build is trusted when it can see repository secrets: any push to this
  # repository, or a pull request whose head lives in this repository. Forked
  # pull requests are deliberately excluded - they get the full test/typecheck
  # /build gate but never produce a published APK.
  NINFIT_TRUSTED_BUILD: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
  # The dedicated NinFit REVIEW/TEST signing certificate. Not the production key.
  # Pinned here so that a change to the signing identity is a reviewable diff and
  # never a silent property of whichever runner happened to pick the job up.
  NINFIT_REVIEW_CERT_SHA256: 'BD:3F:0C:72:A4:A3:92:CD:FE:24:C3:E6:40:46:F3:40:6B:BC:1F:3C:32:7C:73:CE:C7:B8:D9:F9:84:78:B4:D2'

jobs:
  verify:
    name: Test, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Provide test-only Supabase placeholders
        run: |
          printf 'VITE_SUPABASE_URL=https://placeholder.supabase.co\n' > .env.local
          printf 'VITE_SUPABASE_PUBLISHABLE_KEY=placeholder\n' >> .env.local

      - name: Check whitespace errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git diff --check "$BASE_SHA...$HEAD_SHA"
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            git diff --check "$GITHUB_SHA^" "$GITHUB_SHA"
          else
            # A branch push has no base in the event payload, so measure the branch
            # against trunk rather than against its own last commit.
            git fetch --no-tags --quiet origin main
            git diff --check "$(git merge-base FETCH_HEAD "$GITHUB_SHA")" "$GITHUB_SHA"
          fi

      - name: Run full test suite
        run: npm test

      - name: Install ffmpeg for mascot pixel verification
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Verify mascot asset contracts
        run: npm run verify:mascot-assets

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Materialise the NinFit review signing keystore
        if: env.NINFIT_TRUSTED_BUILD == 'true'
        env:
          NINFIT_REVIEW_KEYSTORE_BASE64: ${{ secrets.NINFIT_REVIEW_KEYSTORE_BASE64 }}
          NINFIT_REVIEW_KEY_ALIAS: ${{ secrets.NINFIT_REVIEW_KEY_ALIAS }}
          NINFIT_REVIEW_STORE_PASSWORD: ${{ secrets.NINFIT_REVIEW_STORE_PASSWORD }}
          NINFIT_REVIEW_KEY_PASSWORD: ${{ secrets.NINFIT_REVIEW_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Fail closed. This build will publish an APK for physical-device
          # acceptance, so a missing signing input is a stop, never a fallback.
          missing=''
          [ -n "${NINFIT_REVIEW_KEYSTORE_BASE64:-}" ] || missing="$missing NINFIT_REVIEW_KEYSTORE_BASE64"
          [ -n "${NINFIT_REVIEW_KEY_ALIAS:-}" ] || missing="$missing NINFIT_REVIEW_KEY_ALIAS"
          [ -n "${NINFIT_REVIEW_STORE_PASSWORD:-}" ] || missing="$missing NINFIT_REVIEW_STORE_PASSWORD"
          [ -n "${NINFIT_REVIEW_KEY_PASSWORD:-}" ] || missing="$missing NINFIT_REVIEW_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Review signing secrets unavailable for a trusted, artifact-producing build:$missing. Refusing to publish an APK signed with the runner's transient debug key."
            exit 1
          fi
          # Runner-local, outside the workspace, removed with the runner. Never in the repo.
          keystore_dir="$RUNNER_TEMP/ninfit-review-signing"
          install -d -m 700 "$keystore_dir"
          printf '%s' "$NINFIT_REVIEW_KEYSTORE_BASE64" | base64 -d > "$keystore_dir/review.jks"
          chmod 600 "$keystore_dir/review.jks"
          if [ ! -s "$keystore_dir/review.jks" ]; then
            echo "::error::Decoded review keystore is empty. Not falling back to debug signing."
            exit 1
          fi
          # Only the path is exported. Alias and passwords stay per-step secrets so
          # they are never written to the shared environment file.
          echo "NINFIT_REVIEW_STORE_FILE=$keystore_dir/review.jks" >> "$GITHUB_ENV"

      - name: Compile Android debug app
        working-directory: android
        env:
          # Required only for trusted builds - the ones whose APK is published.
          # A forked-PR build still compiles, it just does not produce an artifact.
          NINFIT_REVIEW_SIGNING_REQUIRED: ${{ env.NINFIT_TRUSTED_BUILD }}
          NINFIT_REVIEW_KEY_ALIAS: ${{ secrets.NINFIT_REVIEW_KEY_ALIAS }}
          NINFIT_REVIEW_STORE_PASSWORD: ${{ secrets.NINFIT_REVIEW_STORE_PASSWORD }}
          NINFIT_REVIEW_KEY_PASSWORD: ${{ secrets.NINFIT_REVIEW_KEY_PASSWORD }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify the APK carries the NinFit review signing identity
        if: env.NINFIT_TRUSTED_BUILD == 'true'
        run: |
          set -euo pipefail
          apk='android/app/build/outputs/apk/debug/app-debug.apk'
          [ -f "$apk" ] || { echo "::error::No APK at $apk"; exit 1; }

          # Compare on hex only, so a tool that prints BD:3F:.. and one that prints
          # bd3f.. are the same reading rather than a mismatch.
          expected="$(printf '%s' "$NINFIT_REVIEW_CERT_SHA256" | tr -cd '0-9A-Fa-f' | tr 'A-Z' 'a-z')"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          # A signing certificate is public by construction, so every tool's raw output
          # is echoed in full below. The first revision of this step captured stdout
          # only, parsed one exact label, and printed nothing it had read - so a run
          # that read nothing could not say which of those three things went wrong.
          # Three independent readings are taken; they must agree with each other and
          # with the pinned fingerprint.

          # ---- Reading 1: hash the DER certificate bytes directly.
          # No fingerprint text is parsed at all. The v1/JAR signature block carries the
          # signer's PKCS#7; ninfit-review-signing.gradle keeps v1 signing enabled and
          # androidReviewSigningContract pins it precisely so this path always exists.
          openssl_sha=''
          openssl_subject=''
          blocks="$(unzip -Z1 "$apk" 'META-INF/*' 2>&1 | grep -Ei '\.(rsa|dsa|ec)$' || true)"
          echo "v1 signature blocks: ${blocks:-<none found>}"
          if [ -n "$blocks" ]; then
            block_count="$(printf '%s\n' "$blocks" | wc -l | tr -d ' ')"
            if [ "$block_count" != "1" ]; then
              echo "::error::Expected exactly one v1 signature block on the acceptance APK, found $block_count."
              exit 1
            fi
            unzip -p "$apk" "$blocks" > "$work/signer.p7"
            openssl pkcs7 -inform DER -in "$work/signer.p7" -print_certs -out "$work/certs.pem" 2>&1
            cert_count="$(grep -c 'BEGIN CERTIFICATE' "$work/certs.pem" || true)"
            if [ "$cert_count" != "1" ]; then
              echo "::error::Expected exactly one signing certificate, found $cert_count. A changed chain is a changed identity."
              exit 1
            fi
            openssl x509 -in "$work/certs.pem" -outform DER -out "$work/signer.der" 2>&1
            openssl_sha="$(sha256sum "$work/signer.der" | cut -d' ' -f1 | tr 'A-Z' 'a-z')"
            openssl_subject="$(openssl x509 -in "$work/certs.pem" -noout -subject 2>&1)"
            echo "openssl subject: $openssl_subject"
            echo "openssl certificate SHA-256: $openssl_sha"
          fi

          # ---- Reading 2: keytool, which ships with the JDK this job already set up.
          keytool_out="$(keytool -printcert -jarfile "$apk" 2>&1 || true)"
          echo '--- keytool -printcert -jarfile ---'
          printf '%s\n' "$keytool_out"
          echo '--- end keytool ---'
          # sed edits line by line, so blanks go and the line structure survives.
          # `tr -d '[:space:]'` here would fold the whole report onto one line and the
          # anchored match would never fire.
          keytool_sha="$(printf '%s\n' "$keytool_out" | sed 's/[[:blank:]]//g' \
            | sed -n 's/^SHA256://Ip' | head -n 1 | tr -cd '0-9A-Fa-f' | tr 'A-Z' 'a-z')"

          # ---- Reading 3: apksigner, when the runner image has build-tools.
          apksigner_sha=''
          apksigner_out=''
          apksigner_bin="$(find "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}/build-tools" \
            -maxdepth 2 -name 'apksigner' -type f 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -n "$apksigner_bin" ]; then
            echo "apksigner: $apksigner_bin"
            # Signature integrity. This must pass whatever its report happens to look
            # like, and set -e stops the job if it does not.
            "$apksigner_bin" verify "$apk"
            apksigner_out="$("$apksigner_bin" verify --print-certs -v "$apk" 2>&1 || true)"
            echo '--- apksigner verify --print-certs -v ---'
            printf '%s\n' "$apksigner_out"
            echo '--- end apksigner ---'
            # Tolerant of label wording, spacing, case and colon-separated hex.
            apksigner_sha="$(printf '%s\n' "$apksigner_out" \
              | grep -iE 'signer.*sha-?256.*digest' | head -n 1 \
              | sed 's/.*[Dd][Ii][Gg][Ee][Ss][Tt][[:space:]]*:[[:space:]]*//' \
              | tr -cd '0-9A-Fa-f' | tr 'A-Z' 'a-z')"
          else
            echo 'apksigner: not present on this runner image'
          fi

          # ---- Reconcile the readings.
          observed=''
          readings=0
          for pair in "openssl:$openssl_sha" "keytool:$keytool_sha" "apksigner:$apksigner_sha"; do
            tool="${pair%%:*}"
            value="${pair#*:}"
            if [ -z "$value" ]; then
              echo "note: $tool produced no fingerprint"
              continue
            fi
            if [ "${#value}" -ne 64 ]; then
              echo "::error::$tool produced a malformed SHA-256 fingerprint of ${#value} hex characters, expected 64."
              exit 1
            fi
            readings=$((readings + 1))
            if [ -z "$observed" ]; then
              observed="$value"
            elif [ "$observed" != "$value" ]; then
              echo "::error::Signing certificate readings disagree: $tool reported $value, an earlier tool reported $observed."
              exit 1
            fi
          done
          # Two readings minimum. One tool agreeing with itself is what the previous
          # revision effectively relied on, and a silent parse failure looked identical
          # to a healthy read. openssl and keytool both work from the v1 block, so this
          # holds even on a runner image with no build-tools.
          if [ "$readings" -lt 2 ]; then
            echo "::error::Only $readings tool(s) could read a signing certificate from the APK; at least 2 independent readings are required. Failing closed."
            exit 1
          fi
          echo "Independent readings that agree: $readings"
          echo "Observed certificate SHA-256: $observed"

          # ---- The identity must not be the generic Android debug key, whichever way
          # a tool renders the subject ("CN=Android Debug" or "CN = Android Debug").
          subjects="$(printf '%s\n%s\n%s\n' "$openssl_subject" "$keytool_out" "$apksigner_out" \
            | tr -d '[:space:]' | tr 'A-Z' 'a-z')"
          case "$subjects" in
            *cn=androiddebug*)
              echo "::error::APK is signed with the generic Android debug identity. This is the update-incompatibility defect this gate exists to prevent."
              exit 1
              ;;
          esac

          # ---- Exactly one signer.
          signer_count="$(printf '%s\n' "$keytool_out" | grep -c '^Signer #' || true)"
          if [ "$signer_count" != "1" ]; then
            echo "::error::Expected exactly one signer on the acceptance APK, keytool reported $signer_count."
            exit 1
          fi

          if [ "$observed" != "$expected" ]; then
            echo "::error::APK signing certificate SHA-256 does not match the pinned NinFit review identity. Expected $expected, observed $observed."
            exit 1
          fi

          apk_sha256="$(sha256sum "$apk" | cut -d' ' -f1)"
          echo "APK file SHA-256: $apk_sha256"
          {
            echo '### NinFit acceptance APK'
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Signing certificate SHA-256: \`$NINFIT_REVIEW_CERT_SHA256\`"
            echo "- Signing identity: **NinFit review/test** (matches the pinned fingerprint)"
            echo "- Independent readings in agreement: $readings"
            echo "- APK file SHA-256: \`$apk_sha256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the review keystore from the runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/ninfit-review-signing"

      - name: Publish NinFit Android debug APK
        if: env.NINFIT_TRUSTED_BUILD == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ninfit-android-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Explain why no APK was published
        if: env.NINFIT_TRUSTED_BUILD != 'true'
        run: |
          echo "::notice::This build cannot read the review signing secrets, so no acceptance APK was published. Only review-signed APKs are published for physical-device acceptance."
