name: Verification Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Test, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Provide test-only Supabase placeholders
        run: |
          printf 'VITE_SUPABASE_URL=https://placeholder.supabase.co\n' > .env.local
          printf 'VITE_SUPABASE_PUBLISHABLE_KEY=placeholder\n' >> .env.local

      - name: Check whitespace errors
        run: git diff --check

      - name: Run full test suite
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
